<!doctype html>
<html lang="en">
  <head>

    <title>Compliance Management System</title>
    <meta
      name="description"
      content="Compliance Management System – manage entities, locations, compliance registers, tasks and audit trails from one place."

    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Link previews (WhatsApp, Slack, Teams, email) -->

    <meta property="og:site_name" content="Compliance Management System" />
    <meta property="og:title" content="Compliance Management System" />
    <meta property="og:description" content="Sign in to manage entities, locations, compliance records and tasks." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Browser UI colour; ThemeContext switches it with the app theme -->
    <meta name="theme-color" content="#ffffff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
